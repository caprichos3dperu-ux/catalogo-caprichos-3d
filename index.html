<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

<meta property="og:type" content="website" />
<meta property="og:site_name" content="Catálogo Caprichos 3D" />
<meta property="og:title" content="Catálogo Caprichos 3D" />
<meta property="og:description" content="Catálogo Caprichos 3D en Arequipa: pokebolas, soportes de GPU, soportes de mandos, colgadores de llaves y más productos impresos en 3D. Pide por WhatsApp." />
<meta property="og:url" content="https://caprichos3dperu-ux.github.io/catalogo-caprichos-3d/" />
<meta property="og:image" content="https://caprichos3dperu-ux.github.io/catalogo-caprichos-3d/assets/logo.jpg" />
<meta property="og:image:type" content="image/jpeg" />

<meta property="og:image:height" content="499" />

<meta name="twitter:card" content="summary" />
<meta name="twitter:title" content="Catálogo Caprichos 3D" />
<meta name="twitter:description" content="Catálogo Caprichos 3D en Arequipa: pokebolas, soportes de GPU, soportes de mandos, colgadores de llaves y más productos impresos en 3D. Pide por WhatsApp." />
<meta name="twitter:image" content="https://caprichos3dperu-ux.github.io/catalogo-caprichos-3d/assets/logo.jpg" />
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#0b7fc4" />
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b1a24" />
<meta name="twitter:image:alt" content="Logo de Caprichos 3D" />
<style>
  :root{
    --sky:#1ea7ec; --sky-deep:#0b7fc4; --sky-soft:#e3f4fd;
    --orange:#ff8a3d; --orange-deep:#e56f1d;
    --yellow:#ffd83d; --yellow-soft:#fff6cf;
    --ink:#12222e; --ink-soft:#3d5566;
    --bg:#f4fafd; --card:#ffffff; --line:#d7e9f3;
    --wa:#1faa55; --wa-deep:#15803d;
    --radius:18px;
    --shadow:0 6px 24px rgba(11,90,140,.10);
  }
  @media (prefers-color-scheme: dark){
    :root{
      --bg:#0b1a24; --card:#122936; --line:#1f4157;
      --ink:#eaf6fd; --ink-soft:#a9c6d6;
      --sky-soft:#123649; --yellow-soft:#3a3312;
      --shadow:0 6px 24px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--ink);
    font-family:"Segoe UI",system-ui,-apple-system,Roboto,"Helvetica Neue",Arial,sans-serif;
    line-height:1.5;-webkit-text-size-adjust:100%}
  img{max-width:100%;display:block}
  a{color:var(--sky-deep)}
  .wrap{max-width:1120px;margin:0 auto;padding:0 16px}

  /* ---------- Hero ---------- */
  .hero{background:linear-gradient(160deg,var(--sky) 0%,var(--sky-deep) 78%);color:#fff;overflow:hidden}
  .hero-inner{display:grid;grid-template-columns:1fr;gap:8px;padding:28px 0 0}
  @media(min-width:820px){.hero-inner{grid-template-columns:1.15fr .85fr;align-items:center;padding:40px 0 0}}
  .hero h1{font-size:clamp(2rem,6vw,3.4rem);line-height:1.05;margin:0 0 6px;font-weight:900;letter-spacing:-.5px}
  .hero h1 .hl{color:var(--yellow)}
  .hero .brand{display:flex;align-items:center;gap:10px;font-weight:800;letter-spacing:2px;font-size:.95rem;text-transform:uppercase;margin-bottom:14px}
  .hero .brand img{width:44px;height:44px;border-radius:50%;border:2px solid #fff;object-fit:cover;background:#000}
  .hero p.lead{font-size:1.08rem;margin:0 0 18px;color:#eaf7ff;max-width:34em}
  .btn{display:inline-flex;align-items:center;gap:9px;min-height:48px;padding:12px 22px;border-radius:999px;
    font-weight:800;font-size:1rem;text-decoration:none;border:0;cursor:pointer}
  .btn-wa{background:var(--wa);color:#fff;box-shadow:0 8px 20px rgba(0,0,0,.22)}
  .btn-wa:active{background:var(--wa-deep)}
  .btn-ghost{background:#fff;color:var(--sky-deep)}
  .hero-img{align-self:end}
  .hero-img img{width:100%;aspect-ratio:760/1075;max-height:430px;object-fit:cover;object-position:top center;
    border-radius:22px 22px 0 0;border:3px solid rgba(255,255,255,.5);border-bottom:0}
  @media(min-width:820px){.hero-img img{max-height:520px}}

  /* ---------- Price summary ---------- */
  .prices{padding:30px 0 6px}
  .prices h2,.section h2{font-size:1.55rem;margin:0 0 4px;font-weight:900}
  .sub{color:var(--ink-soft);margin:0 0 18px}
  .price-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .price-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    padding:18px;box-shadow:var(--shadow)}
  .price-card h3{margin:0 0 10px;font-size:1.05rem}
  .price-card .tag{display:inline-block;font-size:.75rem;font-weight:800;letter-spacing:.6px;text-transform:uppercase;
    background:var(--yellow);color:#5c4a00;padding:3px 9px;border-radius:999px;margin-bottom:10px}
  .price-card .tag.prem{background:var(--orange);color:#fff}
  .tiers{display:flex;gap:8px;flex-wrap:wrap}
  .tier{flex:1;min-width:64px;background:var(--sky-soft);border-radius:12px;padding:8px 6px;text-align:center}
  .tier b{display:block;font-size:1.15rem}
  .tier small{color:var(--ink-soft);font-size:.74rem;font-weight:700}
  .price-card p{margin:10px 0 0;font-size:.9rem;color:var(--ink-soft)}

  /* ---------- Toolbar ---------- */
  .toolbar{position:sticky;top:0;z-index:20;background:var(--bg);padding:14px 0 10px;
    border-bottom:1px solid var(--line)}
  .search{display:flex;gap:10px;flex-wrap:wrap}
  .search input{flex:1;min-width:200px;min-height:48px;padding:12px 16px;font-size:1rem;
    border:2px solid var(--line);border-radius:999px;background:var(--card);color:var(--ink)}
  .search input:focus{outline:none;border-color:var(--sky)}
  .chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
  .chip{min-height:40px;padding:8px 16px;border-radius:999px;border:2px solid var(--line);
    background:var(--card);color:var(--ink);font-weight:700;font-size:.92rem;cursor:pointer}
  .chip[aria-pressed="true"]{background:var(--sky);border-color:var(--sky);color:#fff}
  .count-line{margin:12px 2px 0;color:var(--ink-soft);font-size:.92rem}

  /* ---------- Catalog ---------- */
  .section{padding:26px 0 8px}
  .fam-grid{display:grid;grid-template-columns:1fr;gap:18px}
  @media(min-width:680px){.fam-grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1020px){.fam-grid{grid-template-columns:1fr 1fr 1fr}}
  .fam{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
    overflow:hidden;box-shadow:var(--shadow);display:flex;flex-direction:column}
  .fam figure{margin:0;position:relative}
  .fam figure img{width:100%;aspect-ratio:4/3.1;object-fit:cover;object-position:top center}
  .fam .pg{position:absolute;top:10px;left:10px;background:rgba(10,40,60,.78);color:#fff;
    font-size:.75rem;font-weight:800;padding:4px 10px;border-radius:999px}
  .fam-body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;flex:1}
  .fam-body h3{margin:0;font-size:1.12rem}
  .prod{display:flex;align-items:center;flex-wrap:wrap;gap:6px 8px;padding:9px 0;border-top:1px dashed var(--line)}
  .prod:first-of-type{border-top:0}
  .prod .name{font-weight:700;flex:1 1 110px;min-width:0}
  .prod .pr{flex:1 1 100%;order:4;text-align:left;line-height:1.3;font-size:.85rem;color:var(--ink-soft);font-weight:600}
  .prod .pr b{font-size:.98rem;color:var(--ink)}
  .tiers.grid2{display:grid;grid-template-columns:1fr 1fr}
  .badge{font-size:.68rem;font-weight:800;letter-spacing:.4px;text-transform:uppercase;padding:2px 8px;border-radius:999px;white-space:nowrap}
  .badge.std{background:var(--sky-soft);color:var(--sky-deep)}
  .badge.prem{background:#ffe3cd;color:#9a4a08}
  @media (prefers-color-scheme: dark){.badge.prem{background:#4a2c10;color:#ffb37a}}
  .badge.esp{background:var(--yellow);color:#5c4a00}
  .sku{font-size:.7rem;font-weight:700;letter-spacing:.4px;color:var(--ink-soft);background:var(--bg);border:1px solid var(--line);padding:1px 7px;border-radius:999px;white-space:nowrap}
  .acc .sku{display:inline-block;margin:0 0 6px}
  .res-sku{font-size:.74rem;font-weight:700;color:var(--ink-soft);letter-spacing:.4px;margin:0}
  .order{min-height:40px;padding:8px 13px;border-radius:999px;background:var(--wa);color:#fff;
    text-decoration:none;font-weight:800;font-size:.85rem;display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
  .order:active{background:var(--wa-deep)}
  .fam-note{font-size:.88rem;color:var(--ink-soft);margin:0}
  .empty{display:none;text-align:center;padding:34px 16px;color:var(--ink-soft)}
  .empty.show{display:block}
  /* Tarjetas fuera del primer viewport: render diferido (content-visibility) */
  .cv-deferred{content-visibility:auto;contain-intrinsic-size:auto 560px}
  .gpu-card.cv-deferred{contain-intrinsic-size:auto 430px}

  /* ---------- Accessories ---------- */
  .acc-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:14px}
  .acc{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;box-shadow:var(--shadow)}
  .acc img{width:100%;aspect-ratio:4/3;object-fit:cover;object-position:top center}
  .acc .acc-body{padding:14px 16px 16px}
  .acc h3{margin:0 0 4px;font-size:1.05rem}
  .acc .dims{color:var(--ink-soft);font-size:.88rem;margin:0 0 10px}
  .acc .foot{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}

  /* ---------- GPU supports ---------- */
  .gpu-groups{display:grid;grid-template-columns:1fr;gap:18px}
  .gpu-group{border:1px solid var(--line);border-radius:var(--radius);padding:18px;background:var(--sky-soft)}
  .gpu-group>h3{margin:0 0 4px;font-size:1.18rem;font-weight:900}
  .gpu-group>.gpu-group-sub{margin:0 0 14px;color:var(--ink-soft);font-size:.94rem}
  .gpu-color-note{margin-top:12px;display:flex;gap:10px;align-items:flex-start;background:var(--yellow-soft);border:1.5px solid var(--orange);border-radius:12px;padding:12px 14px;color:var(--ink);font-size:.95rem;line-height:1.45}
  .gpu-color-note strong{color:var(--ink)}
  .gpu-color-dots{display:flex;gap:4px;flex:0 0 auto;padding-top:4px}
  .gpu-color-dots span{width:14px;height:14px;border-radius:50%;border:2px solid #fff;box-shadow:0 0 0 1px rgba(0,0,0,.18);display:block}
  .gpu-color-dots span:nth-child(1){background:#e53935}
  .gpu-color-dots span:nth-child(2){background:#1ea7ec}
  .gpu-color-dots span:nth-child(3){background:#22c55e}
  .gpu-color-dots span:nth-child(4){background:#111827}
  .gpu-color-dots span:nth-child(5){background:#f8fafc}
  .gpu-empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;color:var(--ink-soft)}
  .gpu-empty p{margin:0 0 12px}
  .gpu-empty p:last-child{margin-bottom:0}
  .gpu-card{background:var(--card);border:1px solid var(--line);border-radius:14px;overflow:hidden;box-shadow:var(--shadow)}
  .gpu-card + .gpu-card{margin-top:16px}
  .gpu-card-inner{display:grid;grid-template-columns:1fr;gap:0}
  @media(min-width:820px){.gpu-card-inner{grid-template-columns:1.08fr .92fr}}
  .gpu-gallery{padding:12px 12px 0}
  @media(min-width:820px){.gpu-gallery{padding:14px 0 14px 14px}}
  .gpu-main img{width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:12px;background:#0b1a24}
  .gpu-thumbs{display:grid;grid-template-columns:repeat(5,1fr);gap:8px;margin-top:8px}
  .gpu-thumbs.n2{grid-template-columns:repeat(2,1fr);max-width:230px}
  .gpu-thumbs.n3{grid-template-columns:repeat(3,1fr);max-width:340px}
  .gpu-thumbs.n4{grid-template-columns:repeat(4,1fr)}
  .gpu-thumbs.n6{grid-template-columns:repeat(6,1fr)}
  .gpu-thumbs.n7{grid-template-columns:repeat(7,1fr)}
  .gpu-thumbs.n8{grid-template-columns:repeat(4,1fr)}
  .gpu-thumbs.n9{grid-template-columns:repeat(5,1fr)}
  .gpu-thumbs.n16{grid-template-columns:repeat(8,1fr)}
  @media(max-width:560px){.gpu-thumbs.n6{grid-template-columns:repeat(3,1fr)}.gpu-thumbs.n7{grid-template-columns:repeat(4,1fr)}.gpu-thumbs.n9{grid-template-columns:repeat(3,1fr)}.gpu-thumbs.n16{grid-template-columns:repeat(4,1fr)}}
  .gpu-thumb{padding:0;border:3px solid transparent;border-radius:10px;overflow:hidden;background:none;cursor:pointer;line-height:0}
  .gpu-thumb img{width:100%;aspect-ratio:1/1;object-fit:cover}
  .gpu-thumb[aria-pressed="true"]{border-color:var(--sky)}
  .gpu-thumb:focus-visible{outline:3px solid var(--sky-deep);outline-offset:2px}
  .gpu-info{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
  .gpu-info h4{margin:0;font-size:1.28rem;line-height:1.25}
  .gpu-badge{display:inline-block;font-size:.72rem;font-weight:800;letter-spacing:.5px;text-transform:uppercase;background:var(--yellow);color:#5c4a00;padding:3px 9px;border-radius:999px}
  .gpu-price{font-size:1.55rem;font-weight:900;line-height:1.1}
  .gpu-price small{display:block;font-size:.85rem;font-weight:700;color:var(--ink-soft);margin-top:2px}
  .gpu-info p{margin:0;color:var(--ink-soft);font-size:.96rem}
  .gpu-info .order{min-height:48px;padding:12px 20px;font-size:.98rem;margin-top:4px}

  /* ---------- Info ---------- */
  .info-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:14px}
  .info-card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;box-shadow:var(--shadow)}
  .info-card h3{margin:0 0 8px;font-size:1.02rem}
  .info-card p,.info-card li{font-size:.95rem;color:var(--ink-soft)}
  .info-card p{margin:0 0 6px}
  .info-card ul{margin:0;padding-left:18px}
  .socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:6px}
  .socials a{min-height:44px;display:inline-flex;align-items:center;padding:10px 16px;border-radius:999px;
    border:2px solid var(--line);background:var(--card);color:var(--ink);font-weight:800;text-decoration:none;font-size:.92rem}
  footer{margin-top:36px;background:#0d2f45;color:#cfe9f7;padding:26px 0 90px}
  footer .wrap{display:flex;flex-wrap:wrap;gap:14px;justify-content:space-between;align-items:center}
  footer a{color:#fff;font-weight:700}
  .float-wa{position:fixed;right:16px;bottom:16px;z-index:30;background:var(--wa);color:#fff;
    min-height:56px;padding:14px 20px;border-radius:999px;font-weight:900;text-decoration:none;
    box-shadow:0 10px 26px rgba(0,0,0,.28);display:inline-flex;align-items:center;gap:8px}
  .float-wa:active{background:var(--wa-deep)}
  @media (prefers-reduced-motion: reduce){html{scroll-behavior:auto}}

  /* ---------- Top navigation (sticky) ---------- */
  html{scroll-padding-top:252px}
  @media(min-width:820px){html{scroll-padding-top:204px}}
  .topnav{position:sticky;top:0;z-index:50;background:var(--card);border-bottom:2px solid var(--line);box-shadow:0 6px 20px rgba(11,90,140,.12);transition:transform .35s ease}
  .topnav.nav-hidden{transform:translateY(-105%);pointer-events:none;box-shadow:none}
  @media (prefers-reduced-motion: reduce){.topnav{transition:none}}
  .topnav-inner{padding-top:10px;padding-bottom:10px}
  .topnav-top{display:flex;flex-wrap:wrap;align-items:center;gap:10px 14px;justify-content:space-between}
  .topnav-brand{display:inline-flex;align-items:center;gap:9px;text-decoration:none;color:var(--ink);font-weight:900;font-size:1rem;letter-spacing:.2px}
  .topnav-brand img{width:36px;height:36px;border-radius:50%;object-fit:cover;border:2px solid var(--sky)}
  .topnav-brand small{display:block;font-size:.72rem;font-weight:700;color:var(--ink-soft);letter-spacing:1.2px;text-transform:uppercase}
  .top-socials{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
  .soc{display:inline-flex;align-items:center;gap:7px;min-height:38px;padding:7px 12px;border-radius:999px;text-decoration:none;font-weight:800;font-size:.85rem;border:2px solid var(--line);background:var(--bg);color:var(--ink);line-height:1.1}
  .soc svg{width:17px;height:17px;flex:0 0 17px}
  .soc span{font-weight:700;color:var(--ink-soft);font-size:.8rem}
  .soc.tiktok{background:#111;color:#fff;border-color:#111}.soc.tiktok span{color:#d6d6d6}
  .soc.instagram{background:#fff;border-color:#e1306c;color:#9c1c4e}.soc.instagram span{color:#6b5560}
  .soc.facebook{background:#1877f2;border-color:#1877f2;color:#fff}.soc.facebook span{color:#dbeafe}
  .soc.whatsapp{background:var(--wa);border-color:var(--wa);color:#fff}.soc.whatsapp span{color:#dcfce7}
  @media (prefers-color-scheme: dark){.soc.instagram{background:#2a121c;color:#ffb3c9}.soc.instagram span{color:#d8a8b8}}
  .main-nav{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
  .main-nav a{flex:1 1 auto;text-align:center;min-height:44px;display:inline-flex;align-items:center;justify-content:center;padding:9px 13px;border-radius:12px;background:var(--sky-soft);color:var(--sky-deep);font-weight:900;font-size:.92rem;text-decoration:none;border:2px solid transparent}
  .main-nav a:hover{border-color:var(--sky)}
  .main-nav a.is-active{background:var(--sky-deep);color:#fff;border-color:var(--sky-deep)}
  .main-nav a.nav-contact{background:var(--wa);color:#fff}
  .main-nav a.nav-contact.is-active{background:var(--wa-deep)}
  @media(max-width:560px){.main-nav a{flex:1 1 42%;font-size:.86rem;padding:9px 8px}.main-nav a.nav-contact{flex-basis:100%}.top-socials .soc span{display:inline}}
  /* Section banners */
  .section-banner{scroll-margin-top:252px;background:var(--card);border:1.5px solid var(--line);border-left:6px solid var(--sky);border-radius:14px;padding:18px 18px 16px;margin:28px 0 6px;box-shadow:var(--shadow)}
  .section-banner.orange{border-left-color:var(--orange)}
  .section-banner.yellow{border-left-color:#eab308}
  .section-banner.green{border-left-color:var(--wa)}
  .section-banner.mandos{border-left-color:#7c3aed}
  .section-banner .kicker{font-size:.78rem;font-weight:900;letter-spacing:1.4px;text-transform:uppercase;color:var(--sky-deep);margin:0 0 4px}
  .section-banner h2{font-size:1.65rem;line-height:1.15;margin:0 0 6px;font-weight:900}
  .section-banner p{margin:0;color:var(--ink-soft);max-width:62ch}
  .section-banner .meta{display:inline-block;margin-top:10px;background:var(--yellow-soft);border:1px solid var(--line);padding:5px 11px;border-radius:999px;font-weight:800;font-size:.85rem;color:var(--ink)}
  section[id],div[id="catalogo"]{scroll-margin-top:252px}
  @media(min-width:820px){section[id],div[id="catalogo"]{scroll-margin-top:204px}.section-banner{scroll-margin-top:204px}}
  /* Index cards */
  .index-grid{display:grid;grid-template-columns:1fr;gap:12px;margin-top:14px}
  @media(min-width:680px){.index-grid{grid-template-columns:1fr 1fr}}
  @media(min-width:1020px){.index-grid{grid-template-columns:repeat(3,1fr)}}
  .index-card{display:flex;gap:14px;align-items:flex-start;text-decoration:none;color:var(--ink);background:var(--card);border:1.5px solid var(--line);border-radius:14px;padding:16px;box-shadow:var(--shadow)}
  .index-card:hover{border-color:var(--sky)}
  .index-num{flex:0 0 42px;width:42px;height:42px;border-radius:50%;background:var(--sky);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.05rem}
  .index-card:nth-child(2) .index-num{background:var(--orange-deep)}
  .index-card:nth-child(3) .index-num{background:#7c3aed}
  .index-card:nth-child(4) .index-num{background:#ca8a04}
  .index-card:nth-child(5) .index-num{background:var(--wa)}
  .index-card h3{margin:0 0 3px;font-size:1.02rem}
  .index-card p{margin:0;color:var(--ink-soft);font-size:.9rem}
  .index-card .go{margin-top:6px;font-weight:900;color:var(--sky-deep);font-size:.88rem}
  /* Contact social big */
  .contact-socials{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  .contact-socials .soc{min-height:48px;padding:11px 16px;font-size:.95rem}
  .footer-socials{display:flex;flex-wrap:wrap;gap:8px;width:100%;margin-top:6px}
  .footer-socials .soc{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.35);color:#fff}
  .footer-socials .soc span{color:#cfe9f7}

/* =====================================================================
   APLICACIÓN — enrutador, búsqueda, carrito y vista previa
   ===================================================================== */
function App(){
  var pageSt = useState("inicio"), page = pageSt[0], setPage = pageSt[1];
  var pageRef = useRef("inicio");
  var searchSt = useState(null), searchRes = searchSt[0], setSearchRes = searchSt[1];
  var gqSt = useState(""), globalQ = gqSt[0], setGlobalQ = gqSt[1];

  var pokeFSt = useState("all"), pokeFilter = pokeFSt[0], setPokeFilter = pokeFSt[1];
  var cartSt = useState(function(){
    /* El carrito se recupera de localStorage para que no se pierda al
       recargar la página; si no hay nada guardado, empieza vacío. */
    try {
      var raw = window.localStorage.getItem("caprichos3d-cart");
      if (raw){
        var saved = JSON.parse(raw);
        if (saved && saved.items && Object.prototype.toString.call(saved.order) === "[object Array]") return saved;
      }
    } catch (err) {}
    return { items: {}, order: [] };
  }), cart = cartSt[0], setCart = cartSt[1];
  var toastSt = useState(""), toastMsg = toastSt[0], setToastMsg = toastSt[1];
  var lbSt = useState(null), lb = lbSt[0], setLb = lbSt[1];
  var selSt = useState({}), selPhotos = selSt[0], setSelPhotos = selSt[1];
  var flashSt = useState(null), flashId = flashSt[0], setFlashId = flashSt[1];
  var toastTimer = useRef(null);

  /* ----- Enrutador: cada sección es una página distinta ----- */
  function pageOfElement(el){

    return pg ? pg.getAttribute("data-page") : null;
  }
  function routeFromHash(){
    var h = (location.hash || "").replace(/^#\/?/, "");
    var seg = h.split("/")[0];
    if (seg === "gpu-regulables" || seg === "gpu-no-regulables") return { page: "gpu", anchor: seg };
    if (seg === "mandos-ps5" || seg === "mandos-xbox" || seg === "mandos-universales") return { page: "mandos", anchor: seg };
    if (seg === "accesorios") return { page: "pokebolas", anchor: "accesorios" };
    if (seg === "inicio" || seg === "pokebolas" || seg === "gpu" || seg === "mandos" || seg === "colgadores" || seg === "contacto") return { page: seg, anchor: null };
    if (!seg) return { page: "inicio", anchor: null };
    var el = document.getElementById(seg);
    if (el){ var pg = pageOfElement(el); if (pg) return { page: pg, anchor: seg }; }
    return { page: "inicio", anchor: null };
  }
  function showPage(pg, anchor){
    pageRef.current = pg;
    setPage(pg);
    setSearchRes(null);
    document.title = TITLES[pg] || TITLES.inicio;
    if (anchor){
      setTimeout(function(){
        var el = document.getElementById(anchor);
        if (el) el.scrollIntoView({ behavior: "smooth", block: "start" });
      }, 60);
    } else {
      window.scrollTo(0, 0);
    }
  }
  useEffect(function(){
    var r = routeFromHash();
    showPage(r.page, r.anchor);
  }, []);
  useEffect(function(){
    function onHash(){
      searchedRef.current = "";
      setGlobalQ("");
      if (pageRef.current === "inicio" || pageRef.current === "pokebolas") setPokeTerm("");
      var r = routeFromHash();
      showPage(r.page, r.anchor);
    }
    window.addEventListener("hashchange", onHash);
    return function(){ window.removeEventListener("hashchange", onHash); };
  });

  /* ----- Búsqueda global ----- */
  function setPokeSearch(term){
    if (page !== "inicio" && page !== "pokebolas") return;
    if (pokeTerm !== term) setPokeTerm(term);
  }
  function renderSearch(termRaw){
    var term = norm(termRaw.trim());
    if (!term){
      setPokeSearch("");
      setSearchRes(null);
      document.title = TITLES[page] || TITLES.inicio;
      window.scrollTo(0, 0);
      return;
    }
    setPokeSearch(termRaw.trim());
    var scope = (page === "pokebolas" || page === "gpu" || page === "mandos" || page === "colgadores") ? page : null;
    var words = term.split(/\s+/);
    var matches = INDEX.filter(function(item){
      if (scope && item.page !== scope) return false;
      return words.every(function(w){ return item.hay.indexOf(w) !== -1; });
    });
    var groups = [];
    SEC_ORDER.forEach(function(sec){
      var g = matches.filter(function(m){ return m.sec === sec; });
      if (g.length) groups.push({ sec: sec, items: g });
    });
    var countText = matches.length
      ? matches.length + (matches.length === 1 ? " producto coincide" : " productos coinciden") + " con \u201C" + termRaw.trim() + "\u201D en " + (PAGE_LABEL[page] || "todo el catálogo") + "."
      : "Sin resultados para \u201C" + termRaw.trim() + "\u201D en " + (PAGE_LABEL[page] || "todo el catálogo") + ".";

  useEffect(function(){

  useEffect(function(){

  function toast(msg){
    setToastMsg(msg);

    toastTimer.current = setTimeout(function(){ setToastMsg(""); }, 1800);
  }
  var addToCart = useCallback(function(name, price, img){
    if (!name) return;
    var id = slugId(name);
    setCart(function(prev){
      var items = {}, k;
      for (k in prev.items) items[k] = prev.items[k];
      var order = prev.order.slice();
      if (items[id]){
        items[id] = { id: id, name: items[id].name, price: items[id].price, img: items[id].img, qty: items[id].qty + 1 };
      } else {

  function cartAct(id, act){
    setCart(function(prev){
      var it = prev.items[id];
      if (!it) return prev;
      var items = {}, k;
      for (k in prev.items) items[k] = prev.items[k];
